name: ตรวจสอบคุณภาพ

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: ตรวจไวยากรณ์
        run: npm run lint
      - name: รันชุดทดสอบ
        run: npm test
